name: Release

on:
    push:
        branches: [trunk]
    workflow_dispatch:
        inputs:
            tag:
                description: Annotated product version tag
                required: false
                type: string
            publish:
                description: Publish the verified release
                default: false
                type: boolean

permissions:
    contents: write

jobs:
    release:
        uses: For-Each-Next/wp/.github/workflows/release.yml@43223ba7e7dec9a2e559d8928bc86806b0bb3e36
        with:
            tag: ${{ inputs.tag }}
            publish: ${{ github.event_name == 'push' || inputs.publish }}
            install-browser: true
