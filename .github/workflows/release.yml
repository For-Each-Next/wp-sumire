name: Release

on:
    push:
        branches: [trunk]
    workflow_dispatch:
        inputs:
            tag:
                description: Annotated product version tag
                required: false
                type: string
            publish:
                description: Publish the verified release
                default: false
                type: boolean

permissions:
    contents: write

jobs:
    release:
        uses: For-Each-Next/wp/.github/workflows/release.yml@f673d970301f7ad35935713f94592ca25d58a168
        with:
            tag: ${{ inputs.tag }}
            publish: ${{ github.event_name == 'push' || inputs.publish }}
            install-browser: true
