name: Release

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Annotated product version tag
                required: false
                type: string
            publish:
                description: Publish the verified release
                default: false
                type: boolean

permissions:
    contents: write

jobs:
    release:
        uses: For-Each-Next/wp/.github/workflows/release.yml@c3152e19c67a40348db3bfb3bf8329fd5e4469d8
        with:
            tag: ${{ inputs.tag }}
            publish: ${{ inputs.publish }}
            install-browser: true
